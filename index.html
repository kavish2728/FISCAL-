<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2433"><title>Fiscal Fable CFO — Internal Workspace</title><link rel="stylesheet" href="app/style.css"></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="mark">FF</div><div><b>FISCAL FABLE CFO</b><small>INTERNAL WORKSPACE</small></div></div><nav id="nav"><button class="active" data-page="overview">▦ <span>Overview</span></button><button data-page="clients">♙ <span>Clients</span></button><button data-page="reports">▤ <span>Reports</span></button><button data-page="tasks">✓ <span>Tasks</span></button><button data-page="documents">▣ <span>Documents</span></button></nav><div class="sidefoot">Internal use only<br><small>Virtual CFO & Strategic Advisory</small></div></aside><main><header><div><small class="eyebrow">FISCAL FABLE CFO / INTERNAL</small><h1 id="pageTitle">Overview</h1></div><button class="primary" id="quickReport">＋ Create report</button></header><section id="content"></section></main></div><dialog id="clientDialog"><form method="dialog" id="clientForm"><div class="dialogHead"><h2>Add client</h2><button class="close" value="cancel">×</button></div><label>Company / client name<input required id="clientName" placeholder="Company name"></label><div class="two"><label>Contact person<input id="clientContact" placeholder="Name"></label><label>Email<input id="clientEmail" type="email" placeholder="Email"></label></div><label>Engagement model<select id="clientPlan"><option>Growth</option><option>ScaleUp</option><option>Enterprise</option></select></label><label>Notes<textarea id="clientNotes" rows="3" placeholder="Internal notes"></textarea></label><button class="primary full" type="submit">Save client</button></form></dialog><dialog id="reportDialog"><form id="reportForm"><div class="dialogHead"><h2>Create report</h2><button type="button" class="close" id="closeReport">×</button></div><label>Client<select id="reportClient" required></select></label><label>Report type<select id="reportType"></select></label><div class="two"><label>Reporting period<input id="reportPeriod" placeholder="e.g. October 2026"></label><label>Prepared date<input id="reportDate" type="date"></label></div><label>Executive summary<textarea id="reportSummary" rows="3" placeholder="Summary of the report"></textarea></label><label>Key figures / observations<textarea id="reportFigures" rows="4" placeholder="Add financial figures, KPI observations, context..."></textarea></label><label>Findings<textarea id="reportFindings" rows="4" placeholder="Key findings"></textarea></label><label>Recommendations / action plan<textarea id="reportRecommendations" rows="4" placeholder="Recommendations and next steps"></textarea></label><button class="primary full" type="submit">Save report</button></form></dialog><script src="app/app.js"></script></body></html>
